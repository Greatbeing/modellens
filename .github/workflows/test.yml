name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Pinned: the current ubuntu-latest (26.04) no longer ships Python 3.9 in
    # setup-python's cache, so the 3.9 leg failed before running any test.
    # 24.04 still provides 3.9, and the package claims requires-python >=3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (no network)
        run: |
          python modellens.py --version
          python modellens.py --once ranking

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Worker scoring tests (node:test, zero deps)
        run: node --test
        working-directory: worker
