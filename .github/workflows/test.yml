name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Pinned: the current ubuntu-latest (26.04) no longer ships Python 3.9 in
    # setup-python's cache, so the 3.9 leg failed before running any test.
    # 24.04 still provides 3.9, and the package claims requires-python >=3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (no network)
        run: |
          python modellens.py --version
          python modellens.py --once ranking

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Worker scoring tests (node:test, zero deps)
        run: node --test
        working-directory: worker

  docker:
    # Builds and runs deploy/proxy.Dockerfile, because a Dockerfile that is
    # never executed is a guess: this catches a broken COPY, a missing console
    # script and a healthcheck that never turns healthy.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the proxy image
        run: docker build -f deploy/proxy.Dockerfile -t modellens-proxy:ci .
      - name: Run it with no endpoints and wait for health
        run: |
          set -euo pipefail
          mkdir -p /tmp/mc
          printf '%s\n' '{"endpoints":[],"proxy":{"listen":"0.0.0.0:8766"}}' > /tmp/mc/config.json
          docker run -d --name proxy -p 8766:8766 -v /tmp/mc:/config:ro modellens-proxy:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/modellens/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8766/modellens/health | grep -q '"ok": true'
          curl -fsS http://127.0.0.1:8766/v1/models | grep -q 'auto:fast'
      - name: Show container logs on failure
        if: failure()
        run: docker logs proxy || true
      - name: Verify the image runs as non-root
        run: |
          test "$(docker run --rm --entrypoint id modellens-proxy:ci -u)" != "0"
