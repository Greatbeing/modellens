name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Pinned: the current ubuntu-latest (26.04) no longer ships Python 3.9 in
    # setup-python's cache, so the 3.9 leg failed before running any test.
    # 24.04 still provides 3.9, and the package claims requires-python >=3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (no network)
        run: |
          python modellens.py --version
          python modellens.py --once ranking
