name: Publish to PyPI

# Publishes on every GitHub release, authenticating with a PyPI API token
# stored as the PYPI_API_TOKEN repository secret.
#
# Note: PyPI Trusted Publishing (OIDC, no stored token) did not work here —
# the publisher entry could not be made to match GitHub's claims. If you want
# to revisit it later: https://pypi.org/manage/account/publishing/
#   project `modellens`, owner `Greatbeing`, repo `modellens`,
#   workflow file `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Inspect the artifacts
        run: ls -la dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      # Pinned to a commit, not the mutable `release/v1` tag: a compromised
      # upstream tag would otherwise run in this workflow unchanged.
      # skip-existing: re-running a release must not fail with PyPI 400
      # "File already exists" when the same version was uploaded before.
      # __token__ is the literal username PyPI expects for token auth.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from PyPI and smoke-test
        run: |
          python -m pip install --upgrade modellens-mcp
          modellens --once ranking --help >/dev/null 2>&1 || true
          python -c "import modellens; print('installed modellens', modellens.SERVER_VERSION)"