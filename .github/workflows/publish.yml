name: Publish to PyPI

# Publishes on every GitHub release. PyPI trusts this repository through
# Trusted Publishing (OIDC), so no long-lived API token is stored anywhere.
# Setup: https://pypi.org/manage/account/publishing/  (add this repo + the
# `pypi` environment + the `publish-to-pypi` workflow name)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Inspect the artifacts
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required by PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Pinned to a commit, not the mutable `release/v1` tag: a compromised
      # upstream tag would otherwise run in this workflow unchanged.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from PyPI and smoke-test
        run: |
          python -m pip install --upgrade modellens
          modellens --once ranking --help >/dev/null 2>&1 || true
          python -c "import modellens; print('installed modellens', modellens.SERVER_VERSION)"