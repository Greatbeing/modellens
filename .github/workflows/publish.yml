name: Publish to PyPI

# Publishes on every GitHub release, authenticating with a PyPI API token
# stored as the PYPI_API_TOKEN repository secret.
#
# Note: PyPI Trusted Publishing (OIDC, no stored token) did not work here —
# the publisher entry could not be made to match GitHub's claims. If you want
# to revisit it later: https://pypi.org/manage/account/publishing/
#   project `modellens-mcp` (the PyPI name; `modellens` was the earlier mismatch), owner `Greatbeing`, repo `modellens`,
#   workflow file `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Inspect the artifacts
        run: ls -la dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # ready for Trusted Publishing; unused while a password is set
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Pinned to a commit, not the mutable `release/v1` tag: a compromised
      # upstream tag would otherwise run in this workflow unchanged.
      # skip-existing: re-running a release must not fail with PyPI 400
      # "File already exists" when the same version was uploaded before.
      # __token__ is the literal username PyPI expects for token auth.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install from PyPI and smoke-test
        run: |
          python -m pip install --upgrade modellens-mcp
          modellens --once ranking --help >/dev/null 2>&1 || true
          python -c "import modellens; print('installed modellens', modellens.SERVER_VERSION)"